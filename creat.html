<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Qz.com – تكوين الامتحان</title>
<style>
  :root {
    --bg:#f6f8fa; --card:#fff; --muted:#6b7280; --accent:#0ea5a4;
    --danger:#ef4444; --success:#16a34a;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
    background:linear-gradient(180deg,#f3f6f8,#eef4f7);
    color:#071126;padding:24px;direction:rtl;
  }
  .wrap{max-width:880px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
  h1{margin:0;font-size:20px}
  .muted{color:var(--muted);font-size:13px}
  .card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,0.05);margin-bottom:14px}
  label.input{display:block;margin-bottom:8px;font-weight:700}
  input[type=text], textarea{
    width:100%;padding:10px;border-radius:8px;border:1px solid #e6eef0;margin-top:6px;font-size:14px;
  }
  textarea{height:120px;resize:vertical}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .btn{padding:10px 14px;border-radius:10px;border:0;cursor:pointer;font-weight:700}
  .btn-primary{background:var(--accent);color:white}
  .btn-plain{background:#fff;border:1px solid #e6eef0}
  .small{font-size:13px;color:var(--muted)}
  .file-info{font-size:13px;color:var(--muted);margin-top:8px}
  .preview{background:#fbfdff;border-radius:10px;padding:12px;margin-top:12px;border:1px solid #eef6f8}
  .success{color:var(--success);font-weight:700}
  .error{color:var(--danger);font-weight:700}
  .link-box{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .copy-success{color:var(--success);font-weight:700;margin-left:8px}
  progress{
    width:100%;height:6px;border:none;border-radius:6px;
    background:#e5e7eb;overflow:hidden;display:none;margin-top:12px;
  }
  progress::-webkit-progress-bar{background:#e5e7eb;border-radius:6px;}
  progress::-webkit-progress-value{background:var(--accent);border-radius:6px;}
  progress::-moz-progress-bar{background:var(--accent);border-radius:6px;}
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Qz.com – تكوين الامتحان</h1>
      <div class="small muted">أنشئ كويز وشارك رابطه بسهولة</div>
    </div>
    <div class="small muted" id="statusTop">جاهز</div>
  </header>

  <div class="card">
    <div>
      <label class="input">اسم الكويز</label>
      <input type="text" id="quizName" placeholder="امتحان دون عنوان" />
    </div>

    <div style="margin-top:12px">
      <label class="input">رفع JSON أو لصقه</label>
      <div class="row" style="align-items:center">
        <label class="btn btn-plain" id="chooseBtn">اختر ملف JSON
          <input type="file" id="jsonFile" accept=".json" style="display:none" />
        </label>
        <button class="btn btn-plain" id="pasteBtn">ألصق JSON</button>
        <div class="small" id="fileName">لم يتم اختيار ملف</div>
      </div>
      <textarea id="jsonText" placeholder="أو الصق محتوى JSON هنا..."></textarea>
      <div class="file-info small">صيغة JSON: [{"question":"...","options":["A","B"],"correct_index":0}]</div>

      <div style="margin-top:12px" class="row">
        <div>
          <label class="input">Serial ID (تلقائي)</label>
          <input type="text" id="serialId" readonly />
        </div>
        <div style="align-self:end">
          <button class="btn btn-plain" id="genBtn">توليد ID</button>
        </div>
      </div>

      <progress id="uploadProgress" max="100" value="0"></progress>

      <div style="margin-top:12px" class="row">
        <button class="btn btn-primary" id="previewBtn">معاينة</button>
        <button class="btn btn-primary" id="publishBtn">نشر</button>
        <div style="flex:1"></div>
        <div class="small muted" id="publishStatus"></div>
      </div>

      <div id="previewArea" class="preview" style="display:none">
        <div style="font-weight:700;margin-bottom:8px">معاينة (أول 5 أسئلة):</div>
        <div id="previewList"></div>
      </div>

      <div id="resultArea" style="display:none;margin-top:12px">
        <div style="font-weight:700">رابط المشاركة:</div>
        <div class="link-box">
          <input type="text" id="shareLink" readonly style="padding:8px;border-radius:8px;border:1px solid #e6eef0;flex:1" />
          <button class="btn btn-plain" id="copyBtn">نسخ الرابط</button>
          <div id="copyMsg" class="copy-success" style="display:none">تم النسخ!</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAI21TvGX8jjTbEIDww5GEKcxM9zL6Gkn8",
  authDomain: "ak-sport-a985e.firebaseapp.com",
  databaseURL: "https://ak-sport-a985e-default-rtdb.firebaseio.com/",
  projectId: "ak-sport-a985e",
  storageBucket: "ak-sport-a985e.appspot.com",
  messagingSenderId: "922662521404",
  appId: "1:922662521404:android:0e26b04730ab5dc3ddd139"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// عناصر الصفحة
const jsonFile = document.getElementById('jsonFile');
const chooseBtn = document.getElementById('chooseBtn');
const pasteBtn = document.getElementById('pasteBtn');
const jsonText = document.getElementById('jsonText');
const fileNameEl = document.getElementById('fileName');
const genBtn = document.getElementById('genBtn');
const serialIdEl = document.getElementById('serialId');
const previewBtn = document.getElementById('previewBtn');
const previewArea = document.getElementById('previewArea');
const previewList = document.getElementById('previewList');
const publishBtn = document.getElementById('publishBtn');
const publishStatus = document.getElementById('publishStatus');
const resultArea = document.getElementById('resultArea');
const shareLink = document.getElementById('shareLink');
const copyBtn = document.getElementById('copyBtn');
const copyMsg = document.getElementById('copyMsg');
const statusTop = document.getElementById('statusTop');
const quizNameInput = document.getElementById('quizName');
const progressBar = document.getElementById('uploadProgress');

function genSerial(){return String(Math.floor(Date.now()/1000));}
function setTopStatus(t){statusTop.textContent=t;}
function showStatus(t,isError=false){publishStatus.textContent=t;publishStatus.style.color=isError?'var(--danger)':'inherit';}
function escapeHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');}

chooseBtn.onclick=()=>jsonFile.click();
jsonFile.onchange=async(e)=>{
  const f=e.target.files[0];
  if(!f)return;
  fileNameEl.textContent=f.name+' — '+Math.round(f.size/1024)+' KB';
  const txt=await f.text();
  jsonText.value=txt;
  localStorage.setItem('lastQuizJson',txt);
};
pasteBtn.onclick=()=>jsonText.focus();
genBtn.onclick=()=>serialIdEl.value=genSerial();

previewBtn.onclick=()=>{
  const txt=jsonText.value.trim();
  if(!txt){alert('أضف JSON عبر رفع الملف أو اللصق');return;}
  try{
    const arr=JSON.parse(txt);
    if(!Array.isArray(arr))throw new Error('الملف ليس مصفوفة');
    previewList.innerHTML='';
    arr.slice(0,5).forEach((q,i)=>{
      const div=document.createElement('div');
      div.innerHTML=`<b>${i+1}. ${escapeHtml(q.question||'---')}</b><div class="small">${(q.options||[]).slice(0,4).map((o,j)=>`${j+1}. ${escapeHtml(o)}`).join(' — ')}</div>`;
      previewList.appendChild(div);
    });
    previewArea.style.display='';
    setTopStatus('معاينة ناجحة');
  }catch(e){alert('JSON غير صالح: '+e.message);previewArea.style.display='none';}
};

copyBtn.onclick=async()=>{
  try{await navigator.clipboard.writeText(shareLink.value);
    copyMsg.style.display='';setTimeout(()=>copyMsg.style.display='none',2500);}catch(e){alert('فشل النسخ');}
};

publishBtn.onclick=async()=>{
  const txt=jsonText.value.trim();
  if(!txt){alert('أضف JSON عبر رفع الملف أو اللصق');return;}
  let arr;
  try{arr=JSON.parse(txt);if(!Array.isArray(arr))throw new Error();}
  catch(e){alert('JSON غير صالح');return;}
  localStorage.setItem('lastQuizJson',txt);

  const id=serialIdEl.value||genSerial();
  serialIdEl.value=id;
  const name=quizNameInput.value.trim()||'امتحان دون عنوان';
  publishBtn.disabled=true;
  setTopStatus('جارٍ الحفظ...');
  showStatus('جارٍ الحفظ...');
  progressBar.style.display='block';
  progressBar.value=30;

  let userIp='unknown';
  try{
    const r=await fetch('https://api.ipify.org?format=json');
    const j=await r.json();userIp=j.ip||'unknown';
  }catch(e){}

  try{
    await database.ref('/'+id).set({
      name:name,
      jsonText:txt,
      info:{ip:userIp,time:new Date().toISOString()}
    });

    const share=`${location.origin}/Aser/qz.html?id=${id}`;
    shareLink.value=share;
    resultArea.style.display='';
    progressBar.value=100;
    setTimeout(()=>progressBar.style.display='none',600);
    publishBtn.disabled=false;
    setTopStatus('تم النشر بنجاح ✅');
    showStatus('تم الحفظ بنجاح');
  }catch(e){
    console.error(e);
    progressBar.style.display='none';
    publishBtn.disabled=false;
    setTopStatus('فشل أثناء النشر ❌');
    showStatus('خطأ أثناء الحفظ',true);
  }
};
</script>
</body>
</html>
