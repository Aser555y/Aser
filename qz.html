<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz</title>
<style>
  body{
    font-family: "Cairo", system-ui, sans-serif;
    margin:0;
    background:#f5f7fa;
    color:#111;
    direction:rtl;
    overflow-x:hidden;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
    background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,0.05);
    position:sticky;top:0;z-index:10;
  }
  h1{margin:0;font-size:18px;font-weight:700;color:#0ea5a4}
  .actions{display:flex;gap:8px;align-items:center}
  button{
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    background:#e5e7eb;
    font-weight:600;
    transition:0.2s;
  }
  button:hover{background:#dbe5ea}
  .container{
    max-width:700px;
    margin:40px auto;
    padding:24px;
    background:white;
    border-radius:14px;
    box-shadow:0 4px 20px rgba(0,0,0,0.06);
  }
  .question{
    font-size:20px;
    font-weight:700;
    margin-bottom:18px;
    color:#222;
    text-align:right;
  }
  .option{
    padding:14px 16px;
    background:#f1f5f9;
    border-radius:10px;
    margin-bottom:10px;
    cursor:pointer;
    transition:all 0.2s ease;
    border:2px solid transparent;
  }
  .option:hover{background:#e2e8f0}
  .option.correct{background:#dcfce7;border-color:#22c55e;animation:flashGreen 0.5s}
  .option.wrong{background:#fee2e2;border-color:#ef4444;animation:flashRed 0.5s}
  @keyframes flashGreen{0%{background:#bbf7d0}100%{background:#dcfce7}}
  @keyframes flashRed{0%{background:#fecaca}100%{background:#fee2e2}}
  .progress{
    position:fixed;top:0;left:0;height:4px;
    background:linear-gradient(90deg,#0ea5a4,#22c55e);
    width:0%;transition:width 0.4s ease;
  }
  .result{
    text-align:center;
    font-size:22px;
    padding:40px 10px;
    background:#fff;
    border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,0.05);
    width:fit-content;
    margin:40px auto;
  }
  #idPrompt{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,0.5);
    display:flex;align-items:center;justify-content:center;
    z-index:9999;
  }
  #idPromptBox{
    background:white;
    padding:24px;
    border-radius:14px;
    width:320px;
    text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.2);
  }
  input[type=text]{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-top:8px;
  }
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>
<div class="progress" id="progress"></div>
<header>
  <h1 id="quizTitle">جارٍ التحميل...</h1>
  <div class="actions">
    <button id="copyBtn">نسخ الرابط</button>
    <button id="shareBtn">مشاركة</button>
  </div>
</header>

<div class="container" id="quizContainer" style="display:none">
  <div id="questionBox" class="question"></div>
  <div id="optionsBox"></div>
</div>

<div class="result" id="resultBox" style="display:none"></div>

<div id="idPrompt" style="display:none">
  <div id="idPromptBox">
    <h3>أدخل ID الكويز</h3>
    <input type="text" id="quizIdInput" placeholder="مثلاً 1761089597">
    <button id="loadQuizBtn" style="margin-top:12px;background:#0ea5a4;color:white">تحميل</button>
  </div>
</div>

<audio id="soundCorrect" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="soundWrong" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAI21TvGX8jjTbEIDww5GEKcxM9zL6Gkn8",
  authDomain: "ak-sport-a985e.firebaseapp.com",
  databaseURL: "https://ak-sport-a985e-default-rtdb.firebaseio.com/",
  projectId: "ak-sport-a985e",
  storageBucket: "ak-sport-a985e.appspot.com",
  messagingSenderId: "922662521404",
  appId: "1:922662521404:android:0e26b04730ab5dc3ddd139"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const titleEl = document.getElementById('quizTitle');
const qBox = document.getElementById('questionBox');
const oBox = document.getElementById('optionsBox');
const resultBox = document.getElementById('resultBox');
const progressBar = document.getElementById('progress');
const soundCorrect = document.getElementById('soundCorrect');
const soundWrong = document.getElementById('soundWrong');

let quizData = [];
let current = 0;
let correctCount = 0;

// عرض السؤال
function showQuestion(){
  if(current >= quizData.length){
    showResult();
    return;
  }
  const q = quizData[current];
  qBox.textContent = q.question;
  oBox.innerHTML = '';
  q.options.forEach((opt, i)=>{
    const div = document.createElement('div');
    div.className='option';
    div.textContent = opt;
    div.onclick = ()=>handleAnswer(div, i===q.correct_index);
    oBox.appendChild(div);
  });
  progressBar.style.width = (current/quizData.length*100)+'%';
}

// التعامل مع الإجابة
function handleAnswer(el, correct){
  Array.from(oBox.children).forEach(ch=>ch.onclick=null);
  if(correct){
    el.classList.add('correct');
    soundCorrect.play();
    correctCount++;
  }else{
    el.classList.add('wrong');
    soundWrong.play();
  }
  progressBar.style.width = ((current+1)/quizData.length*100)+'%';
  setTimeout(()=>{current++;showQuestion();},1600);
}

// عرض النتيجة النهائية
function showResult(){
  document.getElementById('quizContainer').style.display='none';
  const percent = Math.round((correctCount/quizData.length)*100);
  resultBox.innerHTML = `
    لقد أجبت بشكل صحيح على <b>${correctCount}</b> من <b>${quizData.length}</b> أسئلة<br>
    نتيجتك: <b style="color:#0ea5a4">${percent}%</b> 🎯
  `;
  resultBox.style.display='block';
}

// نسخ ومشاركة
document.getElementById('copyBtn').onclick=()=>{
  navigator.clipboard.writeText(location.href);
  alert('تم نسخ الرابط ✅');
};
document.getElementById('shareBtn').onclick=()=>{
  if(navigator.share){
    navigator.share({title:document.title,text:'شارك هذا الكويز',url:location.href});
  }else{
    alert('المشاركة غير مدعومة في هذا المتصفح');
  }
};

// تحميل الكويز
async function loadQuiz(id){
  titleEl.textContent = 'جارٍ التحميل...';
  try {
    const snap = await db.ref('/' + id).get();
    if (!snap.exists()) throw new Error('الكويز غير موجود');
    const data = snap.val();
    titleEl.textContent = data.name || 'Quiz';

    const res = await fetch(data.json);
    if (!res.ok) throw new Error('تعذر تحميل ملف JSON');
    const json = await res.json();
    if (!Array.isArray(json) || json.length === 0)
      throw new Error('الملف لا يحتوي أسئلة');

    quizData = json;
    current = 0;
    correctCount = 0;

    document.getElementById('quizContainer').style.display='block';
    resultBox.style.display='none';
    progressBar.style.width='0%';

    showQuestion();
  } catch (e) {
    console.error(e);
    alert('خطأ أثناء تحميل الكويز:\n' + e.message);
    titleEl.textContent = '⚠️ خطأ في التحميل';
  }
}

// فحص id بالرابط
const params = new URLSearchParams(location.search);
let quizId = params.get('id');

if(!quizId){
  document.getElementById('idPrompt').style.display='flex';
  document.getElementById('loadQuizBtn').onclick=()=>{
    const entered = document.getElementById('quizIdInput').value.trim();
    if(!entered)return;
    document.getElementById('idPrompt').style.display='none';
    loadQuiz(entered);
  };
}else{
  loadQuiz(quizId);
}
</script>
</body>
</html>
