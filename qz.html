<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الاختبار</title>
<style>
  body {
    font-family: "Cairo", sans-serif;
    background-color: #f8f8f8;
    color: #222;
    transition: 0.3s;
  }
  .dark {
    background-color: #121212;
    color: #f8f8f8;
  }

  .container {
    max-width: 700px;
    margin: 20px auto;
    padding: 15px;
  }

  .card {
    background: #fff;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    padding: 20px;
    margin-bottom: 15px;
    transition: 0.3s;
  }

  .dark .card {
    background: #1f1f1f;
  }

  .title-card {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 15px;
  }

  .options button {
    display: block;
    width: 100%;
    margin: 6px 0;
    padding: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #e0e0e0;
    transition: 0.2s;
  }

  .dark .options button {
    background: #333;
    color: #fff;
  }

  .options button.correct {
    background-color: #4caf50 !important;
    color: #fff;
  }

  .options button.wrong {
    background-color: #f44336 !important;
    color: #fff;
    animation: shake 0.3s;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-3px); }
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  button.main-btn {
    background-color: #2196f3;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
  }

  button.main-btn:hover {
    opacity: 0.9;
  }

</style>
</head>
<body>
<div class="container">
  <div class="card title-card" id="quizTitle">جارِ التحميل...</div>

  <div class="buttons">
    <button class="main-btn" id="shareBtn">🔗 مشاركة</button>
    <button class="main-btn" id="toggleTheme">🌙</button>
    <button class="main-btn" id="exportPDF">📄 PDF</button>
  </div>

  <div id="questionsContainer"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vibration-polyfill@1.0.0/vibration.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const quizId = new URLSearchParams(window.location.search).get("id") || "demo123";
const apiUrl = `https://your-firebase.firebaseio.com/quizzes/${quizId}.json`;

const titleEl = document.getElementById("quizTitle");
const questionsContainer = document.getElementById("questionsContainer");
const shareBtn = document.getElementById("shareBtn");
const themeBtn = document.getElementById("toggleTheme");
const exportBtn = document.getElementById("exportPDF");

// ✅ تحميل البيانات من Firebase
fetch(apiUrl)
  .then(res => res.json())
  .then(data => {
    const json = JSON.parse(data.jsonText);
    titleEl.textContent = json.title || "اختبار بدون عنوان";
    displayQuestions(json.questions);
  })
  .catch(err => {
    titleEl.textContent = "حدث خطأ أثناء تحميل البيانات";
    console.error(err);
  });

function displayQuestions(questions) {
  questionsContainer.innerHTML = "";
  questions.forEach((q, index) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<h3>${index + 1}. ${q.question}</h3>`;
    
    const optionsDiv = document.createElement("div");
    optionsDiv.className = "options";

    q.options.forEach(opt => {
      const btn = document.createElement("button");
      btn.textContent = opt;
      btn.onclick = () => handleAnswer(btn, q.answer, optionsDiv);
      optionsDiv.appendChild(btn);
    });

    card.appendChild(optionsDiv);
    questionsContainer.appendChild(card);
  });
}

function handleAnswer(btn, correctAnswer, parentDiv) {
  const allBtns = parentDiv.querySelectorAll("button");
  allBtns.forEach(b => b.disabled = true);

  if (btn.textContent.trim() === correctAnswer.trim()) {
    btn.classList.add("correct");
    navigator.vibrate?.(100); // اهتزاز خفيف عند الإجابة الصحيحة
  } else {
    btn.classList.add("wrong");
    navigator.vibrate?.([100, 50, 100]); // اهتزاز مزدوج عند الخطأ
    const correctBtn = Array.from(allBtns).find(b => b.textContent.trim() === correctAnswer.trim());
    if (correctBtn) correctBtn.classList.add("correct");
  }
}

// 🌙 تبديل الوضع الليلي
themeBtn.onclick = () => {
  document.body.classList.toggle("dark");
  themeBtn.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
};

// 🔗 مشاركة العنوان + ID
shareBtn.onclick = async () => {
  const text = `${titleEl.textContent}\nرابط الاختبار:\n${window.location.origin}?id=${quizId}`;
  await navigator.clipboard.writeText(text);
  shareBtn.textContent = "✅ تم النسخ";
  setTimeout(() => shareBtn.textContent = "🔗 مشاركة", 2000);
};

// 📄 تصدير إلى PDF
exportBtn.onclick = () => {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFont("helvetica", "bold");
  doc.text(titleEl.textContent, 10, 10);
  doc.setFont("helvetica", "normal");
  doc.text(`رابط الموقع: ${window.location.origin}`, 10, 20);
  doc.save(`${titleEl.textContent}.pdf`);
};
</script>
</body>
</html>
